<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Track The Cloud">
  <!-- Dark blue rounded background -->
  <rect width="32" height="32" rx="6" fill="#004275"/>
  <!-- Cloud shape: three white bumps + flat base -->
  <circle cx="10.5" cy="19" r="5.5" fill="white"/>
  <circle cx="17"   cy="14" r="6"   fill="white"/>
  <circle cx="23"   cy="18" r="5"   fill="white"/>
  <rect x="5" y="18" width="23" height="7" fill="white"/>
</svg>
